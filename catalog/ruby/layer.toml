name = "ruby"
line = "4.0"
version = "4.0.9"
kind = "runtime"
requires = ["os-min"]
abi = { ruby-api = "4.0.0" }
env = { BUNDLE_SILENCE_ROOT_WARNING = "1" }
source = "https://cache.ruby-lang.org/pub/ruby/4.0/"
license = "Ruby OR BSD-2-Clause"
smoke = '''
set -eu
ruby -e 'require "openssl"; require "zlib"; require "psych"; require "fiddle"'
test "$(ruby -e 'print RUBY_VERSION')" = 4.0.9
test "$(ruby -e 'print RbConfig::CONFIG["ruby_version"]')" = 4.0.0
bundle --version
'''
