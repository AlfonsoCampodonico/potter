# pipenv: a virtualenv at /usr/local/lib/pipenv on the catalog's python, installed by pip from
# requirements.txt (every package pinned by version and SHA-256, wheels only), with a wrapper
# at /usr/local/bin/pipenv.
#
# To bump: change the pin in requirements.in and regenerate requirements.txt with
#   uv pip compile requirements.in --universal --python-version 3.15 --only-binary :all: \
#     --generate-hashes -o requirements.txt
[target.pipenv]
provider = "none"

[target.pipenv.base]
catalog = ["os-min", "python@3.15"]

[target.pipenv.steps.install]
run = '''
set -eu
export SOURCE_DATE_EPOCH=0
python3 -m venv /usr/local/lib/pipenv
/usr/local/lib/pipenv/bin/pip install --no-cache-dir --disable-pip-version-check --no-input \
  --require-hashes --only-binary :all: -r /app/requirements.txt
/usr/local/lib/pipenv/bin/pip check
cat > /usr/local/bin/pipenv <<'POTTER'
#!/bin/sh
exec /usr/local/lib/pipenv/bin/pipenv "$@"
POTTER
chmod 755 /usr/local/bin/pipenv
'''

[target.pipenv.process.pipenv]
cmd = ["/usr/local/bin/pipenv"]
