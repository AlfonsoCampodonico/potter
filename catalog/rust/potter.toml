# rust: rustup (rustup-init pinned by SHA-256) installing the 1.99.0 toolchain with the minimal
# profile into /usr/local/rustup, with the proxies in /usr/local/cargo/bin. What binds the
# install is the pinned rustup-init and the pinned toolchain version: rustup-init fetches the
# channel manifest itself and checks every component against it, along rustup's own hash chain.
# The manifest download below is a tripwire only (the 1.99.0 manifest re-issued fails the build);
# rustup-init never reads that copy. The toolchain stays root-owned and not world-writable:
# builds set their own CARGO_HOME.
[target.rust]
provider = "none"

[target.rust.base]
catalog = ["os-min"]

[target.rust.steps.install]
run = '''
set -eu
umask 022
rustup=1.29.2
toolchain=1.99.0
manifest=ce6dddc886364f8d786514771212cebe9b731ba82d6b859951c6b0ccc516b6a2
case "$(uname -m)" in
  x86_64) triple=x86_64-unknown-linux-gnu; sha256=5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4 ;;
  aarch64) triple=aarch64-unknown-linux-gnu; sha256=a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697 ;;
  *) echo "no rust build for $(uname -m)" >&2; exit 1 ;;
esac
helper() { /usr/lib/apt/apt-helper -o APT::Sandbox::User=root -o Acquire::Retries=3 "$@"; }
helper download-file "https://static.rust-lang.org/dist/channel-rust-$toolchain.toml" /tmp/channel.toml "SHA256:$manifest"
echo "$manifest  /tmp/channel.toml" | sha256sum -c -
helper download-file "https://static.rust-lang.org/rustup/archive/$rustup/$triple/rustup-init" /tmp/rustup-init "SHA256:$sha256"
echo "$sha256  /tmp/rustup-init" | sha256sum -c -
chmod 755 /tmp/rustup-init
export RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo
/tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain "$toolchain" --default-host "$triple"
rm -rf /tmp/rustup-init /tmp/channel.toml /usr/local/rustup/downloads /usr/local/rustup/tmp
# rustup lists the installed components in the order their installs finished, which varies from
# run to run: sorted, the layer is the same bytes every time (rustup reads the list as a set).
for c in /usr/local/rustup/toolchains/*/lib/rustlib/components; do LC_ALL=C sort -o "$c" "$c"; done
'''

[target.rust.process.cargo]
cmd = ["/usr/local/cargo/bin/cargo"]
