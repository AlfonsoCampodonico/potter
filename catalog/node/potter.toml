# node: the official Linux tarball from nodejs.org, unpacked into /usr/local.
[target.node]
provider = "none"

[target.node.base]
catalog = ["os-min"]

[target.node.steps.install]
run = '''
set -eu
version=26.13.0
case "$(uname -m)" in
  x86_64) arch=x64; sha256=5848553868b402d3fabb5b09270649977780a390f832155721025a08b5104455 ;;
  aarch64) arch=arm64; sha256=439e9c438acdf6a6ffe47418da709153d66c4bed812e30a473faacb107dd2791 ;;
  *) echo "no node build for $(uname -m)" >&2; exit 1 ;;
esac
file=node-v$version-linux-$arch.tar.gz
/usr/lib/apt/apt-helper -o APT::Sandbox::User=root -o Acquire::Retries=3 \
  download-file "https://nodejs.org/dist/v$version/$file" "/tmp/$file" "SHA256:$sha256"
echo "$sha256  /tmp/$file" | sha256sum -c -
tar -xzf "/tmp/$file" -C /usr/local --strip-components=1 --no-same-owner \
  --exclude="node-v$version-linux-$arch/CHANGELOG.md" \
  --exclude="node-v$version-linux-$arch/LICENSE" \
  --exclude="node-v$version-linux-$arch/README.md"
rm -f "/tmp/$file"
'''

[target.node.process.node]
cmd = ["/usr/local/bin/node"]
