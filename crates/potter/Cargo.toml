[package]
name = "potter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Build kiln microVM images from source"

[dependencies]
kiln-oci = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "01e7a9fe288160cc2eef9dd1a4a205022b8aef77" }
kiln-registry = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "01e7a9fe288160cc2eef9dd1a4a205022b8aef77" }
kiln-store = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "01e7a9fe288160cc2eef9dd1a4a205022b8aef77" }
potter-cache = { path = "../potter-cache" }
clap = { version = "4.6.7", features = ["derive"] }
potter-config = { path = "../potter-config" }
potter-detect = { path = "../potter-detect" }
potter-exec = { path = "../potter-exec" }
potter-plan = { path = "../potter-plan" }
serde_json = "1.0.151"
tar = "0.4.44"
tempfile = "3.27.0"

[dev-dependencies]
kiln-erofs = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "01e7a9fe288160cc2eef9dd1a4a205022b8aef77" }
kiln-image = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "01e7a9fe288160cc2eef9dd1a4a205022b8aef77" }
rustix = { version = "1.1.5", features = ["fs"] }
vmkit = { git = "https://github.com/AlfonsoCampodonico/vmkit", rev = "c4363a2cfaf421aeaefad1e9c510040c1e0a0508" }
assert_cmd = "2.2.2"
predicates = "3.1.4"
