[package]
name = "potter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Build kiln microVM images from source"

[dependencies]
kiln-run = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "72c82570e6306c9ec2d60ae0473065110a8889d2" }
kiln-oci = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "72c82570e6306c9ec2d60ae0473065110a8889d2" }
kiln-registry = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "72c82570e6306c9ec2d60ae0473065110a8889d2" }
kiln-store = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "72c82570e6306c9ec2d60ae0473065110a8889d2" }
potter-cache = { path = "../potter-cache" }
potter-catalog = { path = "../potter-catalog" }
clap = { version = "4.6.7", features = ["derive", "env"] }
potter-config = { path = "../potter-config" }
potter-detect = { path = "../potter-detect" }
potter-exec = { path = "../potter-exec" }
potter-supply = { path = "../potter-supply" }
potter-plan = { path = "../potter-plan" }
serde_json = "1.0.151"
tar = "0.4.44"
tempfile = "3.27.0"

[dev-dependencies]
kiln-erofs = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "72c82570e6306c9ec2d60ae0473065110a8889d2" }
kiln-image = { git = "https://github.com/AlfonsoCampodonico/kiln", rev = "72c82570e6306c9ec2d60ae0473065110a8889d2" }
rustix = { version = "1.1.5", features = ["fs"] }
vmkit = { git = "https://github.com/AlfonsoCampodonico/vmkit", rev = "924ae248ee09d7969bb865085d4b6a19e1736eee" }
assert_cmd = "2.2.2"
zstd = "0.14.0"
base64 = "0.22"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem"] }
predicates = "3.1.4"
sha2 = "0.10.9"
