[package]
name = "potter-plan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "potter's build plan IR: types, validation, canonical JSON and hashing"

[dependencies]
globset = "0.4"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
