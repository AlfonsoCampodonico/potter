[package]
name = "potter-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "potter's signed runtime catalog: index format, signing, fetching and resolution (P3)"

[dependencies]
potter-plan = { path = "../potter-plan" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
